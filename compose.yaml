services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accessapp
      POSTGRES_USER: accessapp
      POSTGRES_PASSWORD: accessapp-local
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - database:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessapp"]
      interval: 2s
      retries: 20
  api:
    build: ./backend
    environment:
      DB_DSN: pgsql:host=db;port=5432;dbname=accessapp
      DB_USER: accessapp
      DB_PASSWORD: accessapp-local
      PHOTO_DIR: /data/photos
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["photos:/data/photos"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  photos:
