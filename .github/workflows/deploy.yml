name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      BACKEND_DEPLOY_PATH: /opt/access/backend
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: /opt/access
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Extract OSM features
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
          mkdir -p osm-features
          curl --fail --location --retry 3 \
            https://download.geofabrik.de/europe/germany/schleswig-holstein-latest.osm.pbf \
            --output osm-features/schleswig-holstein.osm.pbf
          OSM_PBF="$PWD/osm-features/schleswig-holstein.osm.pbf" \
            sh backend/routing/extract-features.sh > osm-features/osm-features.geojson
          test -s osm-features/osm-features.geojson

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy frontend and backend
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          if [ -z "$BACKEND_ENV" ]; then
            echo 'Missing required production secret: BACKEND_ENV' >&2
            exit 1
          fi
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH' '$BACKEND_DEPLOY_PATH'"
          rsync -az --delete --delay-updates \
            --exclude='/backend/' \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          rsync -az --delete --delay-updates \
            --exclude='.env.local' \
            --exclude='.env.*.local' \
            --exclude='var/' \
            --exclude='vendor/' \
            --exclude='routing/data/' \
            --exclude='public/data/' \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            backend/ "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_DEPLOY_PATH/"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$BACKEND_DEPLOY_PATH/public/data'"
          rsync -az \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            osm-features/osm-features.geojson \
            "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_DEPLOY_PATH/public/data/osm-features.geojson"
          printf '%s\n' "$BACKEND_ENV" | \
            ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "umask 077 && cat > '$BACKEND_DEPLOY_PATH/.env.local'"

      - name: Build and start backend
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$BACKEND_DEPLOY_PATH' && \
             if [ ! -s routing/data/schleswig-holstein.osm.pbf ]; then \
               docker compose --env-file .env.local \
                 -f compose.yaml -f compose.prod.yaml run --rm routing-data; \
             fi && \
             docker compose --env-file .env.local \
               -f compose.yaml -f compose.prod.yaml \
               up --build --detach --remove-orphans --wait"
